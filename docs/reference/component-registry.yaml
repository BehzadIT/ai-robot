components:
  - id: component-raspberry-pi-pico-2w-01
    name: Raspberry Pi Pico 2 W
    aliases: [Pico, control controller]
    category: controller
    manufacturer: Raspberry Pi
    model: Pico 2 W
    variant: null
    revision: null
    documentation_requirement: required
    quantity: 1
    states:
      identity: owner-reported
      inventory: available
      installation: owner-reported
      connection: conflicting
      functional: implemented
    physical_location: Robot control electronics; exact mounting position unverified
    system_role: Real-time command admission, encoder, drivetrain, motor-output, and safety authority.
    owner_subsystem: pico
    software_links:
      - robot-pico-platform/src/control/drivetrain_constants.py
      - robot-pico-platform/cpp/include/robot/control/constants.hpp
    safety_constraints:
      - GPIO inputs and outputs use 3.3 V logic and are not 5 V tolerant.
      - Firmware pin changes require reconciliation with the as-built harness before powered control.
    known_failure_modes:
      - Incorrect pin mapping can invalidate encoder feedback or motor output.
      - Pico Wi-Fi/CYW43 startup is intentionally excluded from the target reliable control dependency path.
    claims:
      - key: identity.board
        value: Raspberry Pi Pico 2 W
        state: owner-reported
        provenance:
          - source_id: source-project-components-updated
            locator: page 2, Microcontroller
      - key: identity.mcu
        value: RP2350
        state: documented-unverified
        provenance:
          - source_id: source-project-components-updated
            locator: page 2, Raspberry Pi Pico 2 W entry
        notes: The historical text list incorrectly says RP2040.
    question_ids: [Q-US002-003, Q-US002-016]
    documentation: docs/assets/components/controllers/raspberry-pi-pico-2w/README.md
    notes: []

      identity: owner-reported
      inventory: available
      installation: owner-reported
      connection: conflicting
      functional: owner-reported
    physical_location: Left and right tracked drivetrain
    system_role: Produce track motion and quadrature feedback under Pico authority.
    owner_subsystem: pico
    software_links:
      - robot-pico-platform/src/control/drivetrain_constants.py
      - robot-pico-platform/cpp/include/robot/control/constants.hpp
    safety_constraints:
      - Encoder supply and logic levels must be measured before assuming 3.3 V operation is reliable.
      - Tracks must be secured before powered motor testing.

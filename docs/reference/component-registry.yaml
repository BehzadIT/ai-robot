  - id: component-pololu-37d-motors-01
    name: Pololu 37D 30:1 gearmotors with encoders
    aliases: [left motor, right motor, 37D drivetrain]
    category: actuator
    manufacturer: Pololu
    model: 37D metal gearmotor
    variant: 30:1, 12 V, integrated quadrature encoder; exact order number unknown
    revision: null
    documentation_requirement: required
    quantity: 2
    instances:
      - id: motor-right
        role: Right track actuator and encoder
        physical_location: Right drivetrain
      - id: motor-left
        role: Left track actuator and encoder
        physical_location: Left drivetrain

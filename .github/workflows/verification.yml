name: Parent verification

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run diagrams:check
      - run: python -m pip install -r requirements-tooling.txt
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - run: python tools/docs/validate_backlog.py
      - run: python tools/docs/validate_us002_records.py
      - run: python -m py_compile tools/robot.py tools/robotlib/core.py
      - run: python tools/robot.py inventory --json
